<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>Kindness Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --border: #e5e7eb;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --danger-bg: #fef2f2;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top left, #e0e7ff, transparent 35%), var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN SCREEN */
    .login-screen {
      min-height: calc(100vh - 48px);
      display: grid;
      place-items: center;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,.08);
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 28px;
      font-weight: 800;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    .login-card h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      transition: .2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99,102,241,.12);
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 700;
      transition: .2s;
    }

    .primary-btn {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      color: white;
      background: var(--primary);
      font-size: 15px;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .error {
      color: var(--danger);
      margin-top: 14px;
      font-size: 14px;
    }

    /* DASHBOARD */
    .dashboard {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

      font-size: 22px;

*   **Hover and Click:** Hover your mouse over the block of code, look for the **Copy code** icon (or "Copy" button) in the top-right corner of the code block, and click it. 
*   **Manual Highlight:** Alternatively, click and drag your cursor over the code to highlight it, then press `Ctrl + C` (Windows) or `Cmd + C` (Mac).
