<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>Kindness Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --border: #e5e7eb;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-hover: #fee2e2;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #e0e7ff, transparent 35%),
        var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN SCREEN */
    .login-screen {
      min-height: calc(100vh - 48px);
      display: grid;
      place-items: center;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,.08);
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 28px;
      font-weight: 800;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    .login-card h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      transition: .2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99,102,241,.12);
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 700;
      transition: .2s;
    }

    .primary-btn {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      color: white;
      background: var(--primary);
      font-size: 15px;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .error {
      color: var(--danger);
      margin-top: 14px;
      font-size: 14px;
    }

    /* DASHBOARD */
    .dashboard {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    .brand h1 {
      font-size: 22px;
      margin: 0;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
    }

    .logout-btn {
      padding: 10px 16px;
      border-radius: 10px;
      background: white;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .logout-btn:hover {
      background: #f9fafb;
    }

    .hero {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      padding: 32px;
      border-radius: 24px;
      margin-bottom: 22px;
      box-shadow: 0 15px 40px rgba(99,102,241,.22);
    }

    .hero h2 {
      margin-bottom: 8px;
      font-size: 27px;
    }

    .hero p {
      margin-bottom: 0;
      opacity: .9;
    }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.04);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
    }

    .links {
      display: grid;
      gap: 12px;
      max-height: 430px;
      overflow-y: auto;
      padding-right: 5px;
    }

    /* SAFE LAYOUT LINK CARD */
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fafafa;
      transition: .2s;
      position: relative;
    }

    .link-card:hover {
      transform: translateY(-2px);
      border-color: #c7d2fe;
      box-shadow: 0 8px 20px rgba(0,0,0,.05);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    /* Dedicated Delete Button placement - moved to far-left isolated position */
    .delete-btn {
      flex-shrink: 0;
      padding: 8px 10px;
      border-radius: 8px;
      background: transparent;
      color: #9ca3af;
      border: 1px solid transparent;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fca5a5;
    }

    .link-info {
      min-width: 0;
      flex: 1;
    }

    .link-title {
      font-weight: 700;
      margin-bottom: 3px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-url {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .launch {
      flex-shrink: 0;
      padding: 10px 18px;
      border-radius: 10px;
      color: white;
      background: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: inline-block;
      margin-left: auto;
    }

    .launch:hover {
      background: var(--primary-dark);
    }

    /* ADMIN CONTROLS */
    .admin {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .admin h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .admin-row {
      display: flex;
      gap: 10px;
    }

    .admin-row input {
      flex: 1;
    }

    .add-btn {
      padding: 0 20px;
      border-radius: 12px;
      background: #111827;
      color: white;
    }

    .add-btn:hover {
      background: #374151;
    }

    /* CONFIRMATION MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(17, 24, 39, 0.4);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .modal-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--danger-bg);
      color: var(--danger);
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      font-size: 22px;
    }

    .modal-card h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .modal-card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .modal-target {
      font-weight: 700;
      color: var(--text);
      word-break: break-all;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .btn-cancel {
      background: #f3f4f6;
      color: var(--text);
    }

    .btn-cancel:hover {
      background: #e5e7eb;
    }

    .btn-delete-confirm {
      background: var(--danger);
      color: white;
    }

    .btn-delete-confirm:hover {
      background: #b91c1c;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .login-card {
        padding: 28px 20px;
      }

      .topbar {
        align-items: flex-start;
      }

      .hero {
        padding: 24px;
      }

      .link-card {
        flex-direction: column;
        align-items: stretch;
      }

      .link-left {
        width: 100%;
      }

      .launch {
        width: 100%;
        text-align: center;
      }

      .admin-row {
        flex-direction: column;
      }

      .add-btn {
        padding: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN SCREEN -->
  <section id="loginScreen" class="login-screen">
    <div class="login-card">

      <div class="logo">K</div>

      <h1>Kindness</h1>

      <p class="subtitle">
        Enter access password to view resources.
      </p>

      <input
        id="accessPassword"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >
        
      <button class="primary-btn" onclick="login()">
        Enter Dashboard
      </button>

      <div id="loginError" class="error hidden">
        Incorrect password.
      </div>

    </div>
  </section>

  <!-- DASHBOARD -->
  <main id="dashboard" class="dashboard hidden">

    <header class="topbar">

      <div class="brand">
        <div class="brand-icon">K</div>

        <div>
          <h1>Kindness</h1>
          <span>Link Dashboard</span>
        </div>
      </div>

      <button class="logout-btn" onclick="logout()">
        Log out
      </button>

    </header>

    <section class="hero">
      <h2>Welcome 👋</h2>
      <p>
        Open your saved resources from one simple dashboard.
      </p>
    </section>

    <section class="panel">

      <div class="panel-header">
        <h2>Saved Links</h2>
        <span id="linkCount" class="count">0 links</span>
      </div>

      <div id="links" class="links"></div>

      <!-- OWNER CONTROLS -->
      <div id="adminPanel" class="admin hidden">

        <h3>Dashboard Controls</h3>

        <div class="admin-row">

          <input
            id="urlInput"
            type="url"
            placeholder="https://example.com"
          >

          <button class="add-btn" onclick="addLink()">
            Add Link
          </button>

        </div>

      </div>

    </section>

  </main>

  <!-- SAFETY CONFIRMATION MODAL -->
  <div id="deleteModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">🗑️</div>
      <h3>Delete Link?</h3>
      <p>
        Are you sure you want to remove <br>
        <span id="modalTargetTitle" class="modal-target"></span>?
      </p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-delete-confirm" onclick="confirmDelete()">Yes, Delete</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://tykyfivfhxwtostafboc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VNPDb6-mXGf2pkxBFIK6Vw_RrlIyBL6";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let links = [];
    let pendingDeleteId = null;

    const ADMIN_EMAIL = "benjaminnaruto68@gmail.com";
    const VIEW_ONLY_PASSWORD = "domain";

    async function login() {
      const password = document.getElementById("accessPassword").value.trim();
      const error = document.getElementById("loginError");
      const adminPanel = document.getElementById("adminPanel");

      if (!password) {
        error.textContent = "Please enter a password.";
        error.classList.remove("hidden");
        return;
      }

      // Check if user entered the View-Only password ("domain")
      if (password === VIEW_ONLY_PASSWORD) {
        adminPanel.classList.add("hidden");
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        error.classList.add("hidden");

        await loadLinks();
        return;
      }

      // Attempt Admin Login via Supabase Auth
      const { error: loginError } = await supabaseClient.auth.signInWithPassword({
        email: ADMIN_EMAIL,
        password: password
      });

      if (loginError) {
        console.error("Login error:", loginError);
        error.textContent = "Incorrect password.";
        error.classList.remove("hidden");
        return;
      }

      // Show Admin controls upon successful admin authentication
      adminPanel.classList.remove("hidden");
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      error.classList.add("hidden");

      await loadLinks();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      document.getElementById("dashboard").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("accessPassword").value = "";
    }

    async function loadLinks() {
      const { data, error } = await supabaseClient
        .from("links")
        .select("*")
        .order("id", { ascending: true });

      if (error) {
        console.error(error);
        alert("Could not load the links from Supabase.");
        return;
      }

      links = data || [];
      renderLinks();
    }

    function renderLinks() {
      const container = document.getElementById("links");
      const count = document.getElementById("linkCount");

      container.innerHTML = "";

      const isAdmin = !document.getElementById("adminPanel").classList.contains("hidden");

      links.forEach(link => {
        const card = document.createElement("div");
        card.className = "link-card";

        card.innerHTML = `
          <div class="link-left">
            ${
              isAdmin
                ? `<button
                     class="delete-btn"
                     onclick="openDeleteModal(${link.id}, '${escapeHTML(link.title)}')"
                     title="Delete this link"
                   >✕</button>`
                : ""
            }
            <div class="link-info">
              <div class="link-title">${escapeHTML(link.title)}</div>
              <div class="link-url">${escapeHTML(link.url)}</div>
            </div>
          </div>

          <a
            class="launch"
            href="${escapeHTML(link.url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open
          </a>
        `;

        container.appendChild(card);
      });

      count.textContent =
        `${links.length} ${links.length === 1 ? "link" : "links"}`;
    }

    async function addLink() {
      const input = document.getElementById("urlInput");
      let url = input.value.trim();

      if (!url) return;

      if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
      }

      try {
        const parsed = new URL(url);

        const { error } = await supabaseClient
          .from("links")
          .insert({
            title: parsed.hostname,
            url: parsed.href
          });

        if (error) {
          console.error(error);
          alert("Could not save the link.");
          return;
        }

        input.value = "";
        await loadLinks();

      } catch {
        alert("Please enter a valid website URL.");
      }
    }

    function openDeleteModal(id, title) {
      pendingDeleteId = id;
      document.getElementById("modalTargetTitle").textContent = title;
      document.getElementById("deleteModal").classList.remove("hidden");
    }

    function closeDeleteModal() {
      pendingDeleteId = null;
      document.getElementById("deleteModal").classList.add("hidden");
    }

    async function confirmDelete() {
      if (!pendingDeleteId) return;

      const idToDelete = pendingDeleteId;
      closeDeleteModal();

      const { error } = await supabaseClient
        .from("links")
        .delete()
        .eq("id", idToDelete);

      if (error) {
        console.error("Could not delete link:", error);
        alert("Could not delete the link.");
        return;
      }

      await loadLinks();
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("accessPassword").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        login();
      }
    });
  </script>

</body>
</html>
